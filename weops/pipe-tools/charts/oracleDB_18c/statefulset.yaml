apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db18c-oracle-db  
  namespace: oracle
  labels:
    app: db18c-oracle-db
    object: oracle
    object_version: 18c
spec:
  serviceName: db18c-oracle-db
  replicas: 1
  selector:
    matchLabels:
      app: db18c-oracle-db
  template:
    metadata:
      labels:
        app: db18c-oracle-db
    spec:
      securityContext:
        runAsUser: 0
        fsGroup: 54321
      containers:
        - name: oracle-db
          image: registry-svc:25000/library/oracle/express:18.4.0-xe
          imagePullPolicy: "IfNotPresent"
          lifecycle:
            postStart:
              exec:
                command: [ "/bin/sh", "-c", "/weops-init/init-monitor-users.sh >/proc/1/fd/1 2>/proc/1/fd/2 &" ]
          volumeMounts:
            - name: weops-oracle-init
              mountPath: /weops-init/init-monitor-users.sh
              subPath: init-monitor-users.sh
              readOnly: true
          ports:
            - containerPort: 1521
            - containerPort: 5500
          readinessProbe:
            exec:
              command: [ "/weops-init/init-monitor-users.sh", "--probe" ]
            initialDelaySeconds: 20
            periodSeconds: 40
            timeoutSeconds: 20
          env:
            - name: ORACLE_PWD
              value: "Weops123!"
            - name: ORACLE_CHARACTERSET
              value: "AL32UTF8"
            - name: WEOPS_SYSTEM_USER
              value: "system"
            - name: WEOPS_COMMON_SYSTEM_USER
              value: "C##SYSTEM"
            - name: WEOPS_MONITOR_USER
              value: "weops"
            - name: WEOPS_ACCOUNT_PASSWORD
              value: "Weops123!"
            - name: WEOPS_TARGET_PDB
              value: "XEPDB1"
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 2000m
              memory: 3000Mi
      volumes:
        - name: weops-oracle-init
          configMap:
            name: oracle-monitor-user-init
            defaultMode: 0755

[[metric]]
context = "uptime"
labels = [ "inst_id", "node_name", "instance_name"]
metricsdesc = { seconds = "instance uptime" }
request = "SELECT instance_number AS inst_id, host_name AS node_name, instance_name, (SYSDATE - startup_time) * 86400 AS seconds FROM v$instance"

[[metric]]
context = "sessions"
labels = [ "status", "type" ]
metricsdesc = { value= "Gauge metric with count of sessions by status and type." }
request = "SELECT status, type, COUNT(*) as value FROM v$session GROUP BY status, type"

[[metric]]
context = "resource"
labels = [ "resource_name" ]
metricsdesc = { current_utilization= "Generic counter metric from v$resource_limit view in Oracle (current value).", limit_value="Generic counter metric from v$resource_limit view in Oracle (UNLIMITED: -1)." }
request = '''
SELECT resource_name, current_utilization, CASE WHEN TRIM(limit_value) LIKE 'UNLIMITED' THEN '-1' ELSE TRIM(limit_value) END as limit_value
FROM v$resource_limit
'''
ignorezeroresult = true

[[metric]]
context = "session_usage"
metricsdesc = { used_percent = "Gauge metric showing percent of the session limit currently consumed." }
request = '''
SELECT
	ROUND(current_utilization / limit_value * 100, 2) AS used_percent
FROM
	v$resource_limit
WHERE
	resource_name = 'sessions'
'''
ignorezeroresult = true

[[metric]]
context = "asm_diskgroup"
labels = [ "diskgroup_name" ]
metricsdesc = { total = "Total size of ASM disk group.", free = "Free space available on ASM disk group.", usage = "Percentage of ASM disk group used."}
request = "SELECT name as diskgroup_name,total_mb*1024*1024 as total,free_mb*1024*1024 as free, (1 - free_mb / total_mb) * 100 as usage FROM v$asm_diskgroup_stat where exists (select 1 from v$datafile where name like '+%')"
ignorezeroresult = true

[[metric]]
context = "activity"
metricsdesc = { value="Generic counter metric from v$sysstat view in Oracle." }
fieldtoappend = "name"
request = "SELECT name, value FROM v$sysstat WHERE name IN ('parse count (total)', 'execute count', 'user commits', 'user rollbacks')"

[[metric]]
context = "process"
metricsdesc = { count="Gauge metric with count of processes." }
request = "SELECT COUNT(*) as count FROM v$process"

[[metric]]
context = "wait_time"
metricsdesc = { value="Generic counter metric from v$waitclassmetric view in Oracle." }
fieldtoappend= "wait_class"
request = '''
SELECT
  n.wait_class as WAIT_CLASS,
  round(m.time_waited*10/(m.INTSIZE_CSEC),3) as VALUE
FROM
  v$waitclassmetric  m, v$system_wait_class n
WHERE
  m.wait_class_id=n.wait_class_id AND n.wait_class != 'Idle'
'''

[[metric]]
context = "tablespace"
labels = [ "tablespace", "type" ]
metricsdesc = { bytes = "Generic counter metric of tablespaces bytes in Oracle.", max_bytes = "Generic counter metric of tablespaces max bytes in Oracle.", free = "Generic counter metric of tablespaces free bytes in Oracle.", used_percent = "Gauge metric showing as a percentage of how much of the tablespace has been used." }
request = '''
SELECT
    dt.tablespace_name as tablespace,
    dt.contents as type,
    dt.block_size * dtum.used_space as bytes,
    dt.block_size * dtum.tablespace_size as max_bytes,
    dt.block_size * (dtum.tablespace_size - dtum.used_space) as free,
    dtum.used_percent
FROM  dba_tablespace_usage_metrics dtum, dba_tablespaces dt
WHERE dtum.tablespace_name = dt.tablespace_name
ORDER by tablespace
'''


[[metric]]
context = "pga"
metricsdesc = { total = "Generic counter metric of aggregate PGA target parameter in Oracle.", used = "Generic counter metric of total PGA allocated in Oracle.", used_percent = "Gauge metric showing as a percentage of how much of the PGA has been used." }
request = '''
SELECT
    (SELECT value FROM v$pgastat WHERE name = 'aggregate PGA target parameter') AS total,
    (SELECT value FROM v$pgastat WHERE name = 'total PGA allocated') AS used,
    (SELECT value FROM v$pgastat WHERE name = 'total PGA allocated') / (SELECT value FROM v$pgastat WHERE name = 'aggregate PGA target parameter') * 100 AS used_percent
FROM
    dual
'''

[[metric]]
context = "sga"
metricsdesc = { total = "Generic counter metric of total SGA size in Oracle.", free = "Generic counter metric of free SGA memory in Oracle.", used_percent = "Gauge metric showing as a percentage of how much of the SGA has been used." }
request = '''
SELECT
    (SELECT SUM(value) FROM v$sga) AS total,
    (SELECT SUM(bytes) FROM v$sgastat WHERE name = 'free memory') AS free,
    ((SELECT SUM(value) FROM v$sga) - (SELECT SUM(bytes) FROM v$sgastat WHERE name = 'free memory')) / (SELECT SUM(value) FROM v$sga) * 100 AS used_percent
FROM
    dual
'''

[[metric]]
context = "db_system"
labels = [ "resource_name" ]
metricsdesc = { value = "Database system resources metric" }
request = '''
select name as resource_name, value
from v$parameter
where name in ('cpu_count', 'sga_max_size', 'pga_aggregate_limit')
'''

[[metric]]
context = "cache_hit_ratio"
labels = [ "cache_hit_type" ]
metricsdesc = { value = "Cache Hit Ratio" }
request = '''
select metric_name cache_hit_type, value
from v$sysmetric
where group_id=2 and metric_id in (2000,2050,2112,2110)
'''
ignorezeroresult = true


### 新增指标 ###

[[metric]]
context = "unusable_index"
metricsdesc = { count = "Oracle数据库中不可用的索引数量" }
request = '''
SELECT
	ltrim(count(*)) as count
FROM
	dba_indexes
WHERE
	STATUS = 'UNUSABLE'
	AND owner IN (
		SELECT
			username
		FROM
			dba_users
		WHERE
			account_status = 'OPEN'
			AND username NOT IN ('SYS', 'SYSTEM')
	)
'''

[[metric]]
context = "invalid_objects"
labels = [ "owner", "object_type", "status" ]
metricsdesc = { count = "Oracle数据库中无效对象数量" }
request = '''
SELECT
    owner,
    object_type,
    status,
    COUNT(*) as count
FROM
    dba_objects
WHERE
    status <> 'VALID'
GROUP BY
    owner, object_type, status
ORDER BY
    owner, object_type, status
'''
ignorezeroresult = true


[[metric]]
context = "session_lock"
labels = [ "username", "status", "client_host", "client_app", "sid", "serial_num", "object_id" ]
metricsdesc = { seconds_in_wait = "Oracle数据库会话锁等待时间(秒)" }
request = '''
SELECT
    s.username,
    s.status,
    s.machine AS client_host,
    s.program AS client_app,
    s.sid,
    s.serial# AS serial_num,
    s.seconds_in_wait,
    lo.object_id
FROM v$session s
JOIN v$locked_object lo ON s.sid = lo.session_id
WHERE s.lockwait IS NOT NULL
'''
ignorezeroresult = true

[[metric]]
context = "session_blocked"
labels = [ "username", "status", "client_host", "client_app", "sid", "serial_num", "sql_id", "blocking_session", "event" ]
metricsdesc = { seconds_in_wait = "Oracle数据库会话被阻塞等待时间(秒)" }
request = '''
SELECT
    s.username,
    s.status,
    s.machine AS client_host,
    s.program AS client_app,
    s.sid,
    s.serial# AS serial_num,
    s.sql_id,
    TO_CHAR(s.blocking_session) AS blocking_session,
    s.event,
    s.seconds_in_wait
FROM v$session s
WHERE s.blocking_session IS NOT NULL
ORDER BY s.seconds_in_wait DESC
'''
ignorezeroresult = true

[[metric]]
context = "datafile"
labels = [ "file_id", "file_name", "status_name" ]
metricsdesc = { status = "Oracle数据库数据文件状态，SYSTEM或ONLINE为1，其他状态为0" }
request = '''
SELECT
    TO_CHAR(file#) AS file_id,
    name AS file_name,
    status AS status_name,
    CASE WHEN status IN ('SYSTEM', 'ONLINE') THEN 1 ELSE 0 END AS status
FROM v$datafile
ORDER BY file#
'''

[[metric]]
context = "redo_log"
metricsdesc = { switches_1h = "Oracle数据库最近1小时重做日志切换次数" }
request = '''
SELECT COUNT(*) AS switches_1h
FROM v$log_history
WHERE first_time >= SYSDATE - (1 / 24)
'''

[[metric]]
context = "log_file_sync"
metricsdesc = { waiting_sessions = "Oracle数据库当前统计窗口内日志文件同步等待会话数", wait_count = "Oracle数据库当前统计窗口内日志文件同步等待次数", time_waited_ms = "Oracle数据库当前统计窗口内日志文件同步累计等待时间(毫秒)", avg_wait_ms = "Oracle数据库当前统计窗口内日志文件同步平均等待时间(毫秒)" }
request = '''
SELECT
    NVL(MAX(m.num_sess_waiting), 0) AS waiting_sessions,
    NVL(SUM(m.wait_count), 0) AS wait_count,
    NVL(SUM(m.time_waited) * 10, 0) AS time_waited_ms,
    NVL(
        CASE
            WHEN SUM(m.wait_count) > 0
            THEN SUM(m.time_waited) * 10 / SUM(m.wait_count)
            ELSE 0
        END,
        0
    ) AS avg_wait_ms
FROM v$eventmetric m
JOIN v$event_name n ON n.event_id = m.event_id
WHERE n.name = 'log file sync'
'''

[[metric]]
context = "deadlocks"
metricsdesc = { total = "Oracle数据库实例启动后累计死锁次数" }
metricstype = { total = "counter" }
request = '''
SELECT NVL(MAX(value), 0) AS total
FROM v$sysstat
WHERE name = 'enqueue deadlocks'
'''

[[metric]]
context = "lock_waiting_sessions"
metricsdesc = { count = "Oracle数据库当前锁等待会话数" }
request = '''
SELECT COUNT(*) AS count
FROM v$session
WHERE blocking_session IS NOT NULL
'''
